<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Andreas Bogossian">
  <style>
    /* placeholder until a real photo exists; same two-scheme palette as logo.svg.
       An SVG style element is XML: no bare angle brackets or ampersands in here. */
    .disc { fill: #2b2b2b; }
    .ring { stroke: #ffffff; }
    .initials { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .disc { fill: #ececec; }
      .ring { stroke: #000000; }
      .initials { fill: #000000; }
    }
  </style>
  <circle class="disc" cx="120" cy="120" r="118"/>
  <circle class="ring" cx="120" cy="120" r="116" fill="none" stroke-width="3"/>
  <text class="initials" x="120" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="80" letter-spacing="2">AB</text>
</svg>
